# Model pins for harnesses that do not use OpenCode model names.
# OpenCode uses the model in each agent's frontmatter.
# Claude Code accepts a model alias such as haiku, sonnet, or opus.
# Codex accepts model#effort to also set the reasoning effort.
# Codex receives only the agents that have a codex model here.
# Antigravity accepts inherit, flash_lite, flash, or pro.
watcher:
  claude: haiku
  codex: gpt-6-luna#medium
  antigravity: flash
